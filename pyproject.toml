[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mstar-analyzer"
version = "0.1.0"
description = "Modular firmware analysis framework for MStar/embedded Set-Top-Box and OTT device firmware."
readme = "Readme.md"
requires-python = ">=3.10"
# license: навмисно не вказано. Проєкт приватний, і в репозиторії
# немає жодного файлу LICENSE чи заяви про ліцензування — вигадувати
# конкретну ліцензію тут означало б приймати юридичне рішення за
# автора проєкту. Додайте `license = "..."` (SPDX-ідентифікатор) або
# `license = {file = "LICENSE"}`, коли рішення буде прийнято.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: System :: Recovery Tools",
    "Programming Language :: Python :: 3",
]
# Проєкт свідомо не має third-party runtime-залежностей — Roadmap.md /
# Readme.md принцип "Modularity before complexity": увесь Stage 2/5
# (детекція + розпакування) навмисно побудований лише на stdlib
# (re, struct, lzma, zlib, bz2, dataclasses), без binwalk/7z у PATH.
# LZ4 (mstar_analyzer/lz4_block.py, extractors/lz4.py) іде ще далі —
# stdlib не має ЖОДНОГО модуля для LZ4, тож декодер написаний з нуля;
# пакет lz4 з PyPI використовується виключно в тестах (dev-залежність
# нижче), як референсний компресор для round-trip перевірки.
dependencies = []

[project.optional-dependencies]
# lz4 тут — ЛИШЕ для генерації тестових fixture-даних
# (tests/test_lz4_block.py, tests/test_lz4_extractor.py): проєкт сам
# розпаковує LZ4 чистим Python (mstar_analyzer/lz4_block.py,
# extractors/lz4.py), без жодної залежності під час роботи — потрібен
# лише РЕФЕРЕНСНИЙ компресор, щоб перевірити коректність round-trip
# проти незалежної реалізації. Тести, що його потребують, коректно
# пропускаються (skip), якщо пакет не встановлено.
dev = ["pytest", "lz4"]

[project.scripts]
mstar-analyzer = "mstar_analyzer.analyze:main"

[tool.setuptools.packages.find]
include = ["mstar_analyzer*"]
